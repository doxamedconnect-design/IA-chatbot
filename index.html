<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doxamed AI Portal</title>
    <script src="https://js.puter.com/v2/"></script>
    <style>
        :root { --bg: #f4f6f9; --primary: #007bff; --text: #333; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; height: 100vh; }
        
        #auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100vw; height: 100vh; background: #fff; position: absolute; z-index: 10; }
        .login-btn { padding: 15px 30px; font-size: 16px; background: var(--primary); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        
        #main-app { display: none; width: 100%; height: 100%; }
        #sidebar { width: 300px; background: #1e293b; color: white; padding: 20px; display: flex; flex-direction: column; border-right: 1px solid #e2e8f0; }
        #chat-container { flex: 1; display: flex; flex-direction: column; background: #fff; }
        
        /* History Sidebar List */
        .history-title { margin-top: 20px; font-size: 12px; text-transform: uppercase; color: #94a3b8; letter-spacing: 0.5px; }
        #history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .history-item { padding: 10px; background: #334155; border-radius: 6px; cursor: pointer; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-item:hover { background: #475569; }
        .new-chat-btn { padding: 10px; background: #0284c7; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 15px; }
        
        #chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { padding: 12px 16px; border-radius: 8px; max-width: 75%; line-height: 1.5; white-space: pre-wrap; }
        .user { background: #e0f2fe; align-self: flex-end; color: #0369a1; }
        .assistant { background: #f1f5f9; align-self: flex-start; color: #334155; }
        
        #input-area { padding: 20px; border-top: 1px solid #e2e8f0; display: flex; gap: 10px; }
        #user-input { flex: 1; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; }
        #send-btn { padding: 12px 24px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; }
        
        .admin-section { margin-top: auto; padding-top: 20px; border-top: 1px solid #475569; display: none; }
        textarea { width: 93%; height: 100px; margin-top: 8px; border-radius: 4px; border: 1px solid #475569; background: #334155; color: white; padding: 8px; font-family: inherit; }
        .save-btn { width: 100%; padding: 8px; background: #10b981; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 8px; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <h2>🔒 Doxamed AI Chatbot</h2>
        <p style="color: #64748b; margin-bottom: 20px;">Please authenticate with Puter to access the chatbot.</p>
        <button class="login-btn" onclick="login()">Login with Puter</button>
    </div>

    <div id="main-app">
        <div id="sidebar">
            <h3 id="user-display">👤 Loading...</h3>
            <button class="new-chat-btn" onclick="createNewChat()">+ New Chat</button>
            <button onclick="logout()" style="background: #ef4444; color: white; border: none; padding: 6px; border-radius: 4px; cursor: pointer; font-size: 12px;">Sign Out</button>
            
            <div class="history-title">Saved Conversations</div>
            <div id="history-list"><!-- Dynamic History Items --></div>

            <div id="admin-panel" class="admin-section">
                <h4>🛠️ Admin Portal</h4>
                <label for="system-prompt">Master System Prompt:</label>
                <textarea id="system-prompt"></textarea>
                <button class="save-btn" onclick="saveMasterPrompt()">Save Settings</button>
            </div>
        </div>

        <div id="chat-container">
            <div id="chat-messages"></div>
            <div id="input-area">
                <input type="text" id="user-input" placeholder="Type your question here..." onkeypress="if(event.key === 'Enter') sendMessage()">
                <button id="send-btn" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let allSavedChats = {}; // Structure: { session_id: { title: "", messages: [] } }
        let currentSessionId = null;
        const ADMIN_EMAIL = "admin@company.com"; 

        async function checkLogin() {
            if (puter.auth.isSignedIn()) {
                currentUser = await puter.auth.getUser();
                setupApp();
            }
        }
        checkLogin();

        async function login() {
            try {
                currentUser = await puter.auth.signIn();
                setupApp();
            } catch (err) {
                alert("Login failed: " + err.message);
            }
        }

        function logout() {
            puter.auth.signOut();
            window.location.reload();
        }

        async function setupApp() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
            document.getElementById('user-display').innerText = `👤 ${currentUser.username}`;

            if (currentUser.username === ADMIN_EMAIL || currentUser.username.includes('admin')) {
                document.getElementById('admin-panel').style.display = 'block';
            }

            const savedPrompt = await puter.kv.get('master_prompt');
            document.getElementById('system-prompt').value = savedPrompt || "You are a helpful company assistant.";

            // Load all historical sessions for this user from DB
            const dbKey = `chat_history_${currentUser.username}`;
            const loadedData = await puter.kv.get(dbKey);
            if (loadedData) {
                allSavedChats = typeof loadedData === 'string' ? JSON.parse(loadedData) : loadedData;
            }
            
            renderHistorySidebar();

            // Open the most recent chat if available, else build a fresh one
            const keys = Object.keys(allSavedChats);
            if (keys.length > 0) {
                loadChatSession(keys[keys.length - 1]);
            } else {
                createNewChat();
            }
        }

        function renderHistorySidebar() {
            const listContainer = document.getElementById('history-list');
            listContainer.innerHTML = '';
            
            Object.keys(allSavedChats).reverse().forEach(id => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerText = allSavedChats[id].title || "Empty Conversation";
                item.onclick = () => loadChatSession(id);
                listContainer.appendChild(item);
            });
        }

        function createNewChat() {
            currentSessionId = 'session_' + Date.now();
            allSavedChats[currentSessionId] = {
                title: "New Chat Session",
                messages: [{"role": "assistant", "content": "Hello! I am your custom in-house AI assistant. How can I help you today?"}]
            };
            displayCurrentMessages();
            renderHistorySidebar();
            saveAllToDatabase();
        }

        function loadChatSession(id) {
            currentSessionId = id;
            displayCurrentMessages();
        }

        function displayCurrentMessages() {
            const chatBox = document.getElementById('chat-messages');
            chatBox.innerHTML = '';
            const currentMessages = allSavedChats[currentSessionId].messages;
            
            currentMessages.forEach(msg => {
                appendMessageHTML(msg.content, msg.role);
            });
        }

        async function saveMasterPrompt() {
            const newPrompt = document.getElementById('system-prompt').value;
            await puter.kv.set('master_prompt', newPrompt);
            alert("Master prompt updated instantly!");
        }

        async function saveAllToDatabase() {
            const dbKey = `chat_history_${currentUser.username}`;
            await puter.kv.set(dbKey, JSON.stringify(allSavedChats));
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const query = inputField.value.trim();
            if (!query) return;

            inputField.value = '';
            
            // If it's the first message, change the title from "New Chat Session" to the query excerpt
            if (allSavedChats[currentSessionId].title === "New Chat Session") {
                allSavedChats[currentSessionId].title = query.substring(0, 25) + (query.length > 25 ? '...' : '');
                renderHistorySidebar();
            }

            // Save user query locally and render
            allSavedChats[currentSessionId].messages.push({ role: 'user', content: query });
            appendMessageHTML(query, 'user');
            saveAllToDatabase();

            const systemPrompt = await puter.kv.get('master_prompt') || "You are a helpful company assistant.";

            try {
                // Submit the ongoing sequence to Claude via Puter Router
                const response = await puter.ai.chat(query, {
                    model: 'claude-3-5-sonnet', 
                    system: systemPrompt
                });

                allSavedChats[currentSessionId].messages.push({ role: 'assistant', content: response });
                appendMessageHTML(response, 'assistant');
                saveAllToDatabase();
            } catch (err) {
                appendMessageHTML("Error running AI module: " + err.message, 'assistant');
            }
        }

        function appendMessageHTML(text, sender) {
            const chatBox = document.getElementById('chat-messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
